<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="senza-reel" content="flessioni">
<meta name="theme-color" content="#0e0f11">
<title>Flessioni</title>
<style>
  :root {
    --bg: #0e0f11; --panel: #191b1f; --text: #f3f4f6; --muted: #9aa0aa;
    --accent: #7ee0a1; --warn: #f2c66d; --line: #2a2d33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    gap: 14px; min-height: 100%;
  }
  .saldo {
    width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: baseline;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px;
  }
  .saldo span { color: var(--muted); font-size: 14px; }
  .saldo strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .avviso { width: 100%; max-width: 520px; color: var(--warn); font-size: 14px; line-height: 1.4; margin: -4px 0 0; }
  .camera {
    position: relative; width: 100%; max-width: 520px; aspect-ratio: 3 / 4; flex: 0 1 auto;
    background: #000; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  }
  .camera video, .camera canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
  }
  .conto {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; text-align: center;
    background: linear-gradient(transparent, rgba(0, 0, 0, .78)); pointer-events: none;
  }
  .conto b { display: block; font-size: 84px; line-height: 1; font-variant-numeric: tabular-nums; }
  .conto small { font-size: 15px; color: #d6d9de; }
  .fase {
    position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0, 0, 0, .6); font-size: 13px; font-weight: 600;
  }
  .diag {
    position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0, 0, 0, .6); font-size: 12px; font-variant-numeric: tabular-nums; color: #d6d9de;
  }
  .diag:empty { display: none; }
  .stato { color: var(--muted); font-size: 15px; text-align: center; min-height: 22px; max-width: 520px; line-height: 1.4; }
  button {
    appearance: none; border: 0; border-radius: 14px; padding: 16px; width: 100%; max-width: 520px;
    font: 700 17px -apple-system, system-ui, sans-serif; background: var(--accent); color: #0b1a10;
  }
  button.stop { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
  <div class="saldo"><span>Tempo disponibile</span><strong id="saldo">—</strong></div>
  <p class="avviso" id="avviso" hidden></p>

  <div class="camera">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="fase" id="fase" hidden></div>
    <div class="diag" id="diag"></div>
    <div class="conto"><b id="conto">0</b><small id="guadagno">1 flessione = 1 minuto</small></div>
  </div>

  <div class="stato" id="stato">Appoggia il telefono a terra, di lato o in diagonale, con braccia e spalle inquadrate.</div>
  <button id="avvia">Inizia</button>

<script type="module">
const MEDIAPIPE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELLO = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const SECONDI_PER_FLESSIONE = 60;
const K_PENDING = 'senzaReel:pending'; // secondi guadagnati, in attesa che lo script li incassi
const K_SALDO = 'senzaReel:saldo';     // saldo in secondi, scritto dallo script

const $ = (id) => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');

// ───────── Conteggio ─────────
// Due segnali, vale il più forte:
//  1. piegamento del gomito, misurato in 3D (non dipende da dove è appoggiato il telefono)
//  2. discesa delle spalle verso le mani, rispetto alla distanza massima vista di recente
const SCENDI = 0.55, SALI = 0.25, VIS_MIN = 0.3, DURATA_MIN_MS = 200;
const GOMITO_TESO = 155, GOMITO_PIEGATO = 105;
const LATI = [[11, 13, 15], [12, 14, 16]]; // [spalla, gomito, polso] sinistra e destra
const clamp01 = (v) => Math.max(0, Math.min(1, v));

function angolo(a, b, c, w = 1, h = 1) {
  const v1 = [(a.x - b.x) * w, (a.y - b.y) * h, (a.z - b.z) || 0];
  const v2 = [(c.x - b.x) * w, (c.y - b.y) * h, (c.z - b.z) || 0];
  const cos = (v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2]) / (Math.hypot(...v1) * Math.hypot(...v2) || 1);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

function creaContatore() {
  let fase = null, liscio = null, tGiu = 0, conto = 0, dMax = 0;
  return {
    get conto() { return conto; },
    // lm: punti nell'immagine (0..1); mondo: gli stessi punti in 3D (metri), se disponibili
    aggiorna(lm, mondo, t, w, h) {
      const lati = LATI.filter(([s, g, p]) =>
        Math.min(lm[s].visibility ?? 1, lm[g].visibility ?? 1, lm[p].visibility ?? 1) >= VIS_MIN);
      if (!lati.length) return { visibile: false, fase, conto, fatta: false };

      const angoli = lati.map(([s, g, p]) => mondo
        ? angolo(mondo[s], mondo[g], mondo[p])
        : angolo(lm[s], lm[g], lm[p], w, h));
      const ang = angoli.reduce((x, y) => x + y, 0) / angoli.length;
      const piegaGomito = clamp01((GOMITO_TESO - ang) / (GOMITO_TESO - GOMITO_PIEGATO));

      const media = (idx) => ({
        x: idx.reduce((s, i) => s + lm[i].x, 0) / idx.length,
        y: idx.reduce((s, i) => s + lm[i].y, 0) / idx.length,
      });
      const spalle = media(lati.map((l) => l[0])), polsi = media(lati.map((l) => l[2]));
      const d = Math.hypot((spalle.x - polsi.x) * w, (spalle.y - polsi.y) * h);
      dMax = Math.max(d, dMax * 0.998);
      const discesaSpalle = dMax > 0 ? clamp01((1 - d / dMax) / 0.35) : 0;

      const p = Math.max(piegaGomito, discesaSpalle);
      liscio = liscio === null ? p : liscio * 0.5 + p * 0.5;
      let fatta = false;
      if (liscio < SALI) {
        if (fase === 'giu' && t - tGiu >= DURATA_MIN_MS) { conto++; fatta = true; }
        fase = 'su';
      } else if (liscio > SCENDI && fase === 'su') {
        fase = 'giu'; tGiu = t;
      }
      return { visibile: true, fase, conto, fatta, angolo: ang, discesa: liscio };
    },
  };
}

// ───────── Modello ─────────
let landmarker = null;
async function caricaModello() {
  if (landmarker) return landmarker;
  const { PoseLandmarker, FilesetResolver } = await import(MEDIAPIPE + '/vision_bundle.mjs');
  const fileset = await FilesetResolver.forVisionTasks(MEDIAPIPE + '/wasm');
  const crea = (delegate) => PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODELLO, delegate },
    runningMode: 'VIDEO',
    numPoses: 1,
  });
  try { landmarker = await crea('GPU'); } catch (_) { landmarker = await crea('CPU'); }
  return landmarker;
}

// ───────── Credito ─────────
const leggi = (k) => { try { return parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch (_) { return 0; } };
function accredita() {
  try { localStorage.setItem(K_PENDING, String(leggi(K_PENDING) + SECONDI_PER_FLESSIONE)); } catch (_) {}
}
function mostraSaldo() {
  const scriptAttivo = document.documentElement.hasAttribute('data-senza-reel');
  const inAttesa = leggi(K_PENDING);
  const avviso = $('avviso');
  if (scriptAttivo) {
    $('saldo').textContent = Math.floor((leggi(K_SALDO) + inAttesa) / 60) + ' min';
    avviso.hidden = true;
  } else {
    $('saldo').textContent = Math.floor(inAttesa / 60) + ' min in attesa';
    avviso.textContent = 'Script Senza Reel non rilevato. Apri questa pagina in Safari con Userscripts attivo: ' +
      'i minuti restano in attesa finché lo script non li incassa.';
    avviso.hidden = false;
  }
}
mostraSaldo();
setInterval(mostraSaldo, 500);

// ───────── Suono ─────────
let audio = null;
function bip() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 880;
  g.gain.setValueAtTime(0.25, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.12);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.12);
}

// ───────── Sessione ─────────
let attivo = false, stream = null, contatore = null, blocco = null, ultimoTempo = -1;

function disegna(lm) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!lm) return;
  ctx.lineWidth = Math.max(3, w / 120); ctx.lineCap = 'round'; ctx.strokeStyle = '#7ee0a1'; ctx.fillStyle = '#fff';
  for (const [s, g, p] of LATI) {
    ctx.beginPath();
    ctx.moveTo(lm[s].x * w, lm[s].y * h); ctx.lineTo(lm[g].x * w, lm[g].y * h); ctx.lineTo(lm[p].x * w, lm[p].y * h);
    ctx.stroke();
    for (const i of [s, g, p]) { ctx.beginPath(); ctx.arc(lm[i].x * w, lm[i].y * h, ctx.lineWidth, 0, 7); ctx.fill(); }
  }
}

function ciclo() {
  if (!attivo) return;
  requestAnimationFrame(ciclo);
  if (video.readyState < 2 || video.currentTime === ultimoTempo) return;
  ultimoTempo = video.currentTime;
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  const t = performance.now();
  const ris = landmarker.detectForVideo(video, t);
  const lm = ris.landmarks[0], mondo = ris.worldLandmarks && ris.worldLandmarks[0];
  disegna(lm);
  const fase = $('fase'), diag = $('diag');
  if (!lm) {
    $('stato').textContent = 'Non ti vedo: entra nell\'inquadratura.';
    fase.hidden = true; diag.textContent = 'nessuna persona';
    return;
  }
  const r = contatore.aggiorna(lm, mondo, t, video.videoWidth, video.videoHeight);
  if (!r.visibile) {
    $('stato').textContent = 'Non vedo bene le braccia: sposta il telefono.';
    fase.hidden = true; diag.textContent = 'braccia non visibili';
    return;
  }
  diag.textContent = 'gomito ' + Math.round(r.angolo) + '° · discesa ' + Math.round(r.discesa * 100) + '%';
  $('stato').textContent = r.fase ? 'Ti vedo. Continua!' : 'Mettiti in posizione, braccia tese.';
  fase.hidden = !r.fase;
  fase.textContent = r.fase === 'giu' ? 'GIÙ' : 'SU';
  if (r.fatta) {
    accredita(); bip();
    $('conto').textContent = r.conto;
    $('guadagno').textContent = '+' + r.conto + ' min guadagnati';
    mostraSaldo();
  }
}

async function avvia() {
  const btn = $('avvia');
  btn.disabled = true;
  try {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) {}
    $('stato').textContent = 'Chiedo la fotocamera…';
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    $('stato').textContent = 'Carico il riconoscimento (solo la prima volta è lento)…';
    await caricaModello();
    try { blocco = await navigator.wakeLock.request('screen'); } catch (_) {}
    contatore = creaContatore();
    $('conto').textContent = '0';
    $('guadagno').textContent = '1 flessione = 1 minuto';
    attivo = true;
    btn.textContent = 'Fine'; btn.className = 'stop';
    ciclo();
  } catch (e) {
    ferma();
    $('stato').textContent = e && e.name === 'NotAllowedError'
      ? 'Fotocamera negata. Consentila nelle impostazioni di Safari per questo sito.'
      : 'Errore: ' + (e && e.message ? e.message : e);
  }
  btn.disabled = false;
}

function ferma() {
  attivo = false;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null;
  if (blocco) { try { blocco.release(); } catch (_) {} blocco = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $('fase').hidden = true;
  $('diag').textContent = '';
  const btn = $('avvia');
  btn.textContent = 'Inizia'; btn.className = '';
  $('stato').textContent = contatore && contatore.conto
    ? 'Fatto: ' + contatore.conto + ' flessioni, ' + contatore.conto + ' minuti guadagnati.'
    : 'Appoggia il telefono a terra, di lato o in diagonale, con braccia e spalle inquadrate.';
}

$('avvia').addEventListener('click', () => (attivo ? ferma() : avvia()));
document.addEventListener('visibilitychange', () => { if (document.hidden && attivo) ferma(); });

// usato solo per le prove
window.senzaReelProva = { creaContatore, caricaModello };
</script>
</body>
</html>
